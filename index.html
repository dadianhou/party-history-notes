<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13271f" />
    <meta name="description" content="党史与中国特色社会主义理论课程笔记站" />
    <title>党史 · 中特课程笔记站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">史</span>
          <div>
            <p class="eyebrow">公考政治理论学习库</p>
            <h1>党史 · 中特课程笔记站</h1>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="themeToggle" title="切换深色模式" aria-label="切换深色模式">☼</button>
          <button class="outline-button" id="printButton">打印 / 导出 PDF</button>
        </div>
      </header>

      <section class="hero">
        <div>
          <span class="kicker">BV1Nu4y1x7y9 · 8 节课程</span>
          <h2>把视频听懂，再把考点串起来。</h2>
          <p>按“时间线、理论线、老师强调、易错辨析、复习卡片”组织，适合电脑、平板和手机长期打开。</p>
          <div class="hero-actions">
            <button class="primary-button" id="startButton">从第一节开始</button>
            <a class="text-link" href="https://www.bilibili.com/video/BV1Nu4y1x7y9?p=1" target="_blank" rel="noreferrer">打开原视频 ↗</a>
          </div>
        </div>
        <div class="hero-stat">
          <strong>7h05m</strong>
          <span>课程总时长</span>
          <div class="hero-line"><i></i></div>
          <small>当前站点进度：<b id="progressText">0%</b></small>
        </div>
      </section>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-head">
            <div>
              <span class="eyebrow">课程目录</span>
              <h2>按章节学习</h2>
            </div>
            <span class="count-badge">8 节</span>
          </div>
          <label class="search-box">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="搜索考点、会议、理论…" />
          </label>
          <div class="filter-row">
            <button class="filter active" data-filter="all">全部</button>
            <button class="filter" data-filter="党史">党史</button>
            <button class="filter" data-filter="中特">中特</button>
            <button class="filter" data-filter="essay">申论</button>
          </div>
          <nav id="lessonNav" class="lesson-nav"></nav>
          <div class="sidebar-note">
            <span>学习提示</span>
            <p>先看章节主线，再背表格和口令。老师强调部分是做题时的判断抓手。</p>
          </div>
        </aside>

        <main class="content">
          <div class="content-top">
            <div>
              <span class="eyebrow">当前章节</span>
              <h2 id="lessonTitle"></h2>
            </div>
            <div class="content-actions">
              <button class="ghost-button" id="markButton">标记已学</button>
              <button class="ghost-button" id="copyLinkButton">复制本页链接</button>
            </div>
          </div>
          <div id="lessonContent"></div>
        </main>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭图片查看器">×</button>
      <button class="lightbox-control lightbox-prev" id="lightboxPrev" aria-label="上一张">‹</button>
      <figure>
        <img id="lightboxImage" alt="" />
        <figcaption id="lightboxCaption"></figcaption>
      </figure>
      <button class="lightbox-control lightbox-next" id="lightboxNext" aria-label="下一张">›</button>
      <div class="lightbox-toolbar">
        <button id="zoomOut" aria-label="缩小">−</button>
        <span id="zoomText">100%</span>
        <button id="zoomIn" aria-label="放大">＋</button>
        <button id="zoomReset" aria-label="重置缩放">重置</button>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
